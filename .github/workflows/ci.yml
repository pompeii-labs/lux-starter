name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
        env:
          PUBLIC_LUX_URL: http://127.0.0.1:15890
          PUBLIC_LUX_PUBLISHABLE_KEY: lux_pub_ci_placeholder
          PUBLIC_API_URL: http://127.0.0.1:15892

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lux-db/lux-swift
          ref: 6a834a850d0eb6f2c2b06e3babccfaff35319c39
          path: lux-swift
      - run: mv lux-swift ../lux-swift
      - run: brew install xcodegen jq
      - run: xcodegen generate
        working-directory: apps/ios
      - run: >-
          xcodebuild -project apps/ios/LuxLab.xcodeproj -scheme LuxLab
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - run: bash scripts/test-ios.sh
