version: 2
env:
    NODE_ENV: production
endpoints:
    lux:
        protocol: http
        port: 5890
        public: true
        primary: false
        health:
            type: http
            path: /auth/v1/.well-known/jwks.json
            statuses: [200]
            timeout: 2m
    api:
        protocol: http
        port: 3000
        public: true
        primary: false
        health:
            type: http
            path: /v1
            statuses: [200]
            timeout: 2m
    web:
        protocol: http
        port: 5173
        public: true
        primary: true
        health:
            type: http
            path: /
            statuses: [200]
            timeout: 2m
